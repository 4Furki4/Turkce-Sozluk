global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend preview_database
    bind :5432
    default_backend development_database

backend development_database
    server development pgbouncer-development:5432 check inter 5s resolvers docker init-addr last,libc,none
